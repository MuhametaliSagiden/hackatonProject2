[project]
name = "certificate-radar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn[standard]", "jinja2", "python-multipart", "sqlmodel", "cryptography>=42", "certifi", "httpx", "openpyxl", "pyyaml", "apscheduler>=3.10,<4"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[dependency-groups]
dev = ["pytest", "ruff"]

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
ignore = ["BLE001", "B008", "I001"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
