EXPIRED:
  reason: "Срок действия сертификата истёк {days} дн. назад"
  recommendation: "Срочно перевыпустите сертификат и установите его на сервис. Проверьте, не нарушена ли работа клиентов."

EXPIRING:
  reason: "Сертификат истекает через {days} дн."
  recommendation: "Запланируйте перевыпуск и замену сертификата до даты окончания. Назначьте ответственного."

SELF_SIGNED:
  reason: "Сертификат самоподписанный, клиенты не могут проверить его подлинность"
  recommendation: "Замените сертификат на выпущенный корпоративным или публичным центром сертификации."

CHAIN_ERROR:
  reason: "Ошибка цепочки доверия: {error}"
  recommendation: "Установите на сервере полную цепочку (промежуточные сертификаты) или используйте сертификат доверенного центра сертификации."

HOSTNAME_MISMATCH:
  reason: "Имя {host} не совпадает с CN/SAN сертификата: {names}"
  recommendation: "Перевыпустите сертификат с корректным именем в SAN или исправьте привязку сертификата на сервисе."

WEAK_KEY:
  reason: "Слабый ключ: {bits} бит"
  recommendation: "Перевыпустите сертификат с ключом RSA не менее 2048 бит или ECDSA P-256."

WEAK_SIGNATURE:
  reason: "Устаревший алгоритм подписи: {hash}"
  recommendation: "Перевыпустите сертификат с подписью SHA-256 или выше."

NO_OWNER:
  reason: "Не назначен владелец сервиса"
  recommendation: "Назначьте ответственного в инвентаре, чтобы уведомления доходили до исполнителя."

UNREACHABLE:
  reason: "Сервис недоступен: {error}"
  recommendation: "Проверьте доступность хоста и порта, правила межсетевого экрана и корректность DNS-имени."
