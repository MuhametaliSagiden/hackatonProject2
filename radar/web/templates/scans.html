{% extends "base.html" %}{% block content %}<h1>История сканов</h1><table><tr><th>ID</th><th>Начало</th><th>Завершение</th><th>Статус</th><th>Обработано</th><th>Источник</th></tr>{% for item in items %}<tr><td><a href="/scans/{{ item.id }}">{{ item.id }}</a></td><td>{{ item.started_at }}</td><td>{{ item.finished_at or '—' }}</td><td>{{ item.status }}</td><td>{{ item.processed }}/{{ item.total }}</td><td>{{ item.triggered_by }}</td></tr>{% endfor %}</table>{% endblock %}
