{% extends "base.html" %}
{% block content %}
<h1>Настройки</h1>
{% if message %}<div class="panel">{{ message }}</div>{% endif %}
{% if error %}<div class="panel">{{ error }}</div>{% endif %}
<form class="settings" method="post">
  <label>Информационный порог<input type="number" name="info_days" value="{{ values.get('info_days','60') }}" required></label>
  <label>Предупреждение<input type="number" name="warning_days" value="{{ values.get('warning_days','30') }}" required></label>
  <label>Критический порог<input type="number" name="critical_days" value="{{ values.get('critical_days','14') }}" required></label>
  <label>Пороги уведомлений<input name="notify_thresholds" value="{{ values.get('notify_thresholds','60,30,14,7,1') }}" required></label>
  <label>Расписание, часов<input type="number" name="schedule_hours" value="{{ values.get('schedule_hours','0') }}" min="0"></label>
  <button class="primary">Сохранить и пересчитать</button>
</form>
<form method="post" action="/settings/test">
  <button>Отправить тестовое уведомление</button>
</form>
{% endblock %}
