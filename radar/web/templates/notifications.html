{% extends "base.html" %}{% block content %}<h1>Уведомления</h1><form method="post" action="/api/notifications/test"><button>Тестовое уведомление</button></form><table><tr><th>Время</th><th>Канал</th><th>Порог</th><th>Успех</th><th>Сообщение</th></tr>{% for item in logs %}<tr><td>{{ item.sent_at }}</td><td>{{ item.channel }}</td><td>{{ item.threshold }}</td><td>{{ 'Да' if item.success else 'Нет' }}</td><td>{{ item.message }}</td></tr>{% endfor %}</table>{% endblock %}
