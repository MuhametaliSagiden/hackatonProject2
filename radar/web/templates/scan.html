{% extends "base.html" %}{% block content %}{% if item.status == 'running' %}<meta http-equiv="refresh" content="2">{% endif %}<h1>Скан #{{ item.id }}</h1><div class="card"><p>Статус: <strong>{{ item.status }}</strong></p><p>Обработано: {{ item.processed }}/{{ item.total }}</p><progress value="{{ item.processed }}" max="{{ item.total or 1 }}"></progress></div><p><a href="/scans">Вернуться к истории</a></p>{% endblock %}
